# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/0.45.0/Configuring/Animations/ 

animations {
    enabled = yes
    # bezier = overshot, 0.13, 0.99, 0.29, 1.1
    # animation = windowsIn, 1, 4, overshot, slide
    # animation = windowsOut, 1, 5, default, popin 80%
    # animation = border, 1, 5, default
    # animation = workspacesIn, 1, 6, overshot, slide
    # animation = workspacesOut, 1, 6, overshot, slidefade 80%
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = flatline, 1.0, 1.0, 0, 0
    bezier = flatlinetwo, 0, 0, 1, 1
    bezier = shuff, 0, 0.33, 0.66, 1.0
    bezier = BorderRotation, 0.45, 0, 0.55, 1
    animation = windows, 1, 3, myBezier
    animation = windowsIn, 1, 3, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 46, default
    animation = borderangle, 1, 92, flatlinetwo, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, myBezier
    animation = specialWorkspace, 1, 2, myBezier, slidevert
}
